<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إتحاف الحُفّاظ · التطبيق التفاعلي</title>
<meta name="description" content="اختر السورة أو الآية فتظهر لك متشابهاتها في القرآن الكريم مع توجيه الإسكافي والكرماني وابن الزبير وطريقة التمييز">
<meta property="og:type" content="website">
<meta property="og:title" content="إتحاف الحُفّاظ بمتشابه الألفاظ · التطبيق التفاعلي">
<meta property="og:description" content="اختر السورة أو الآية فتظهر لك متشابهاتها مع توجيهها وطريقة تمييزها">
<meta property="og:url" content="https://kmasskmass-svg.github.io/ithaf-al-huffaz/app.html">
<meta property="og:image" content="https://kmasskmass-svg.github.io/ithaf-al-huffaz/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B5D4B">
<style>
@font-face{font-family:AmiriQ;src:url(fonts/AmiriQuran.ttf);font-display:swap}
@font-face{font-family:AmiriW;src:url(fonts/Amiri-Regular.ttf);font-display:swap}
@font-face{font-family:AmiriW;src:url(fonts/Amiri-Bold.ttf);font-weight:bold;font-display:swap}
:root{--g:#0B5D4B;--g2:#08473a;--gold:#B08D3C;--line:#E2D7B5;--card:#FFFDF6;--bg:#FAF6EA;--blue:#1F4E8C;--red:#B3261E}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);font-family:AmiriW,'Traditional Arabic',serif;font-size:18px;color:#222;line-height:1.7}
header{background:var(--g);color:#fff;padding:12px 16px 10px;border-bottom:4px double var(--gold);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.top h1{margin:0;font-size:26px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top a{color:#FFF3C9;font-size:16px;text-decoration:none;border:1px solid #E9D9A8;border-radius:8px;padding:1px 10px;white-space:nowrap}
.tabs{display:flex;gap:6px;max-width:1100px;margin:10px auto 0}
.tabs button{flex:1;font:inherit;font-size:17px;padding:5px;border-radius:9px 9px 0 0;border:0;background:#ffffff22;color:#fff;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--g);font-weight:bold}
main{max-width:1100px;margin:0 auto;padding:14px 12px 50px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.ctl label{color:var(--g);font-weight:bold}
select,input{font:inherit;font-size:18px;padding:4px 8px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:#222}
input[type=number]{width:90px}
input[type=search]{flex:1;min-width:200px}
.btn{font:inherit;font-size:16px;padding:3px 12px;border-radius:8px;border:1.5px solid var(--g);background:#fff;color:var(--g);cursor:pointer}
.btn.p{background:var(--g);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:15px;padding:1px 12px;border-radius:20px;border:1.5px solid var(--gold);background:#fff;color:#7a5f20;cursor:pointer}
.chip.on{background:var(--gold);color:#fff}
.info{color:#555;margin:4px 2px 12px;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.04)}
.ch{display:flex;align-items:center;gap:10px;padding:6px 14px;background:#F3ECD6;border-bottom:1px solid var(--line)}
.badge{font-size:14px;color:#fff;border-radius:12px;padding:0 10px;white-space:nowrap}
.bA{background:var(--g)}.bB{background:var(--blue)}.bC{background:var(--red)}
.head{flex:1;font-family:AmiriQ;font-size:22px;color:var(--g);line-height:2}
.num{color:var(--gold);font-weight:bold;white-space:nowrap;font-size:16px}
.pl{padding:6px 14px;border-bottom:1px dashed #eadfbf}
.pl:last-of-type{border-bottom:0}
.pl .lb{font-weight:bold;color:var(--blue);cursor:pointer;font-size:16px;white-space:nowrap}
.pl .lb.tg::before{content:'◆ ';color:var(--gold)}
.q{font-family:AmiriQ;font-size:22px;line-height:2.15}
.q .hB{color:var(--blue);font-weight:bold}.q .hC{color:var(--red);font-weight:bold}
.q .br{color:var(--gold)}
.tm{font-size:15px;color:#666}
.tm b{color:#7a5f20;font-weight:normal}
.tm .tq{font-family:AmiriQ;font-size:18px;color:var(--red)}
.tw{padding:4px 14px 10px;border-top:1px solid var(--line);background:#fffefa}
details{margin-top:6px}
summary{cursor:pointer;font-weight:bold;font-size:16px}
.s1{color:var(--blue)}.s2{color:var(--gold)}.s3{color:var(--g)}
.twt{font-size:17px;padding:2px 8px 4px;color:#333}
.twt .qq{color:var(--g);font-family:AmiriW}
.none{text-align:center;color:#888;padding:30px 10px}
.more{display:block;margin:0 auto}
.aya{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:12px}
footer{text-align:center;color:#888;font-size:14px;padding:16px}
#load{text-align:center;padding:60px;color:var(--g)}
@media(max-width:600px){.top h1{font-size:20px}.head,.q{font-size:20px}body{font-size:17px}}
</style></head><body>
<header><div class="top"><h1>إتحاف الحُفّاظ بمتشابه الألفاظ</h1><a href="./">الكتب PDF</a></div>
<div class="tabs"><button data-m="s" class="on">بالسورة</button><button data-m="v">بالآية</button><button data-m="q">بالنص</button></div></header>
<main><div id="load">جارٍ تحميل البيانات…</div><div id="app" hidden>
<div class="ctl" id="cs"><label>السورة</label><select id="ss"></select>
<div class="chips" id="fl"><button class="chip on" data-t="">الكل</button><button class="chip" data-t="A">آيات متطابقة</button><button class="chip" data-t="B">عبارات متطابقة</button><button class="chip" data-t="C">اختلاف يسير</button></div></div>
<div class="ctl" id="cv" hidden><label>السورة</label><select id="vs"></select><label>الآية</label><input type="number" id="va" min="1" value="1">
<button class="btn" id="vp">‹ السابقة</button><button class="btn" id="vn">التالية ›</button></div>
<div class="ctl" id="cq" hidden><input type="search" id="qi" placeholder="اكتب كلمات من الآية بلا تشكيل، مثل: ولا تقتلوا أولادكم"><button class="btn p" id="qb">ابحث</button></div>
<div class="info" id="info"></div><div id="res"></div></div></main>
<footer>إعداد: كليب بن أحمد بن ضيف الله الزهراني · المصادر: درة التنزيل للإسكافي، البرهان للكرماني، ملاك التأويل لابن الزبير</footer>
<script>
const AR='٠١٢٣٤٥٦٧٨٩',ar=n=>String(n).replace(/\d/g,d=>AR[d]);
const TN={A:'آية متطابقة',B:'عبارة متطابقة',C:'اختلاف يسير'};
const SC={'الإسكافي':'s1','الكرماني':'s2','ابن الزبير':'s3'};
const norm=s=>s.replace(/[ؐ-ًؚ-ٰٟۖ-ۭ࣓-ࣿـ]/g,'').replace(/[ٱأإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim();
const loose=s=>norm(s).replace(/[اويء]/g,'');
let D,mode='s',ftype='',NG=[],shown=0,cur=[],ctx=0;
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function quote(t){return esc(t).replace(/﴿([^﴾]*)﴾/g,'<span class="qq">﴿$1﴾</span>');}
function card(gi,s,v){
  const g=D.g[gi];
  let h=`<div class="card"><div class="ch"><span class="badge b${g.t}">${TN[g.t]}</span><span class="head">${g.h?esc(g.h):'<span style="font-family:AmiriW;font-size:16px;color:#888">الآية بتمامها</span>'}</span><span class="num">${ar(g.p.length)} مواضع</span></div>`;
  const P=[...g.p].sort((x,y)=>((x[0]==s?0:1)-(y[0]==s?0:1))||0);
  for(const [ps,pa,txt,hl,tm] of P){
    const H=new Set(hl);const w=txt.split(' ').map((x,i)=>H.has(i)?`<span class="h${g.t}">${x}</span>`:x).join(' ');
    const tg=(ps==s&&(!v||pa==v))?' tg':'';
    const tmh=g.t=='C'?(/^(مثل|—)/.test(tm)?esc(tm):`<span class="tq">${esc(tm)}</span>`):esc(tm);
    h+=`<div class="pl"><span class="lb${tg}" data-s="${ps}" data-a="${pa}">${D.names[ps-1]} ${ar(pa)}</span> <span class="q"><span class="br">﴿</span>${w}<span class="br">﴾</span></span><div class="tm"><b>التمييز:</b> ${tmh}</div></div>`;
  }
  if(g.w.length){h+='<div class="tw">';let last='';
    g.w.forEach(([who,t])=>{h+=`<details${g.w.length<=2&&who!=last?' open':''}><summary class="${SC[who]}">توجيه ${who}</summary><div class="twt">${quote(t)}</div></details>`;last=who;});
    h+='</div>';}
  return h+'</div>';
}
function render(list,s,v){cur=list;shown=0;ctx=[s,v];$('res').innerHTML='';more();}
function more(){
  const b=document.querySelector('.more');if(b)b.remove();
  const chunk=cur.slice(shown,shown+40).map(gi=>card(gi,ctx[0],ctx[1])).join('');shown+=40;
  $('res').insertAdjacentHTML('beforeend',chunk||(shown<=40?'<div class="none">لا يوجد شيء هنا.</div>':''));
  if(shown<cur.length)$('res').insertAdjacentHTML('beforeend','<button class="btn p more" onclick="more()">عرض المزيد</button>');
}
function showS(){
  const s=+$('ss').value;location.hash='s='+s;
  let L=D.s[s]||[];const c={A:0,B:0,C:0};L.forEach(gi=>c[D.g[gi].t]++);
  if(ftype)L=L.filter(gi=>D.g[gi].t==ftype);
  $('info').textContent=`سورة ${D.names[s-1]}: ${ar(c.A)} آية متطابقة، و${ar(c.B)} عبارة متطابقة، و${ar(c.C)} موضعًا من المتشابه مع اختلاف يسير.`;
  render(L,s);
}
function showV(){
  const s=+$('vs').value;let a=+$('va').value||1;a=Math.max(1,Math.min(a,D.cnt[s-1]));$('va').value=a;$('va').max=D.cnt[s-1];
  location.hash='v='+s+':'+a;
  const L=D.v[s+':'+a]||[];const ord={A:0,C:1,B:2};L.sort((x,y)=>ord[D.g[x].t]-ord[D.g[y].t]);
  $('info').textContent=L.length?`${D.names[s-1]} ${ar(a)}: ${ar(L.length)} ${L.length>2&&L.length<11?'مجموعات':'مجموعة'} من المتشابه.`:`${D.names[s-1]} ${ar(a)}: لا متشابه مسجَّلًا لهذه الآية.`;
  render(L,s,a);
}
function showQ(){
  const q=loose($('qi').value);if(q.length<2){$('info').textContent='اكتب كلمتين على الأقل.';$('res').innerHTML='';return;}
  location.hash='q='+encodeURIComponent($('qi').value);
  const L=[];NG.forEach((t,i)=>{if(t.includes(q))L.push(i)});
  $('info').textContent=L.length?`${ar(L.length)} نتيجة.`:'لا نتائج. جرّب كلمات أقل أو بلا همزات.';
  render(L,0);
}
function setMode(m){mode=m;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));
  $('cs').hidden=m!='s';$('cv').hidden=m!='v';$('cq').hidden=m!='q';({s:showS,v:showV,q:showQ})[m]();}
function goV(s,a){$('vs').value=s;$('va').value=a;setMode('v');scrollTo(0,0);}
fetch('data.json').then(r=>r.json()).then(d=>{D=d;
  const opts=D.names.map((n,i)=>`<option value="${i+1}">${ar(i+1)}. ${n}</option>`).join('');$('ss').innerHTML=opts;$('vs').innerHTML=opts;
  NG=D.g.map(g=>loose(g.p.map(p=>p[2]).join(' | ')));
  $('load').hidden=true;$('app').hidden=false;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  $('ss').onchange=showS;$('vs').onchange=()=>{$('va').value=1;showV()};$('va').onchange=showV;
  $('vp').onclick=()=>{let s=+$('vs').value,a=+$('va').value-1;if(a<1){if(s>1){s--;a=D.cnt[s-1]}else a=1}$('vs').value=s;$('va').value=a;showV()};
  $('vn').onclick=()=>{let s=+$('vs').value,a=+$('va').value+1;if(a>D.cnt[s-1]){if(s<114){s++;a=1}else a--}$('vs').value=s;$('va').value=a;showV()};
  $('qb').onclick=showQ;$('qi').onkeydown=e=>{if(e.key=='Enter')showQ()};
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ftype=c.dataset.t;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x==c));showS()});
  $('res').onclick=e=>{const l=e.target.closest('.lb');if(l)goV(+l.dataset.s,+l.dataset.a)};
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith('v=')){const[s,a]=h.slice(2).split(':');goV(+s,+a)}
  else if(h.startsWith('q=')){$('qi').value=h.slice(2);setMode('q')}
  else{if(h.startsWith('s='))$('ss').value=+h.slice(2)||1;setMode('s')}
}).catch(()=>{$('load').textContent='تعذّر تحميل البيانات. افتح الصفحة من الموقع المنشور لا من ملف على الجهاز.'});
</script></body></html>
